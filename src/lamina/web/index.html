<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta
      name="description"
      content="Read a source-linked guide and practice its questions in Lamina."
    />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Lamina | Study guide</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="rail" aria-label="Workspace">
        <a class="brand" href="#learn" aria-label="Lamina home">
          <img src="assets/mark.svg" alt="" width="38" height="38" />
          <span>LAMINA</span>
        </a>
        <div class="rail-label">Generated guide</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button
            class="nav-link active"
            type="button"
            data-view="learn"
            aria-current="page"
          >
            <span class="nav-num">01</span> Learn
            <span class="nav-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="nav-link" type="button" data-view="practice">
            <span class="nav-num">02</span> Practice
            <span class="nav-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="nav-link" type="button" data-view="sources">
            <span class="nav-num">03</span> Sources
            <span class="nav-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="nav-link" type="button" data-view="coverage">
            <span class="nav-num">04</span> Coverage
            <span class="nav-arrow" aria-hidden="true">↗</span>
          </button>
        </nav>
        <div class="rail-bottom">
          <div class="rail-rule"></div>
          <p>
            Read the guide and open the source behind each claim.
          </p>
          <div id="rail-downloads" class="rail-downloads"></div>
          <div class="rail-foot">
            Answers and self-ratings stay in this browser.
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <span class="topbar-label">STUDY GUIDE</span>
          <span class="topbar-side"
            ><span class="status-dot"></span> IN YOUR BROWSER</span
          >
        </header>
        <main id="main" tabindex="-1">
          <div id="app" aria-live="polite"></div>
        </main>
        <footer class="site-footer">
          <span>Lamina / source-linked guide</span
          ><span id="footer-downloads" class="footer-downloads"></span>
        </footer>
      </div>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
