name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[pdf,slides,http,tokens,test]'
      - run: python -m pytest tests -q
      - run: lamina demo --output demo
      - run: lamina search 'leases' --workspace .lamina-demo --json
      - run: python -m lamina.studio_site studio-site --pdf
      - run: python -m pip wheel . --no-deps --wheel-dir dist
