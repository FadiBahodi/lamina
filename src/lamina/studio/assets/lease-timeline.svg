<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">An expired lease does not stop a worker</title>
<desc id="desc">Worker A pauses. Its lease expires and worker B claims a new owner token. A finishes late. A token comparison rejects A's stale commit while B can publish.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#798296" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="520" rx="20" fill="#f5f6fa"/>
<text x="44" y="46" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#685cf5">THE DISTINCTION THAT MATTERS</text>
<text x="44" y="88" font-family="Arial,sans-serif" font-size="31" fill="#1b2030">Expiry allows recovery. Ownership controls publication.</text>
<g font-family="Arial,sans-serif" font-size="14" fill="#51586b">
<text x="44" y="163" font-weight="700">WORKER A</text><text x="44" y="288" font-weight="700">WORKER B</text>
<path d="M188 158H1040M188 284H1040" stroke="#dce0ea" stroke-width="2"/>
<rect x="202" y="132" width="194" height="52" rx="8" fill="#e9e7ff"/><text x="225" y="163">Claim · token A</text>
<path d="M401 158H574" stroke="#857cab" stroke-width="2" stroke-dasharray="5 5"/><text x="449" y="139" fill="#635995">paused</text>
<path d="M579 110V352" stroke="#a09bb5" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="541" y="380" fill="#635995">Lease expires</text>
<rect x="608" y="258" width="178" height="52" rx="8" fill="#e9e7ff"/><text x="628" y="289">Claim · token B</text>
<path d="M585 158H834" stroke="#857cab" stroke-width="2" marker-end="url(#arrow)"/><text x="662" y="139">A resumes and finishes</text>
<rect x="849" y="128" width="204" height="61" rx="8" fill="#f2e7ed"/><text x="869" y="151" font-weight="700" fill="#924b70">Stale commit rejected</text><text x="869" y="173" font-size="12">token A ≠ current token B</text>
<path d="M793 284H834" stroke="#685cf5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="849" y="254" width="204" height="61" rx="8" fill="#e1eee9"/><text x="869" y="278" font-weight="700">B can publish</text><text x="869" y="300" font-size="12">token B = current owner</text>
<rect x="44" y="415" width="1032" height="68" rx="10" fill="#1b2030"/>
<text x="67" y="444" fill="#f5f6fa" font-size="15">The timeout creates an opportunity to retry; it does not prove the first worker stopped.</text>
<text x="67" y="466" fill="#bdc4d7" font-size="13">Original explanatory figure · Lamina engineering field guide · illustrative sequence, not a runtime trace</text>
</g></svg>
